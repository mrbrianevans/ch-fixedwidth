<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CH fixed-width converter</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./src/main.ts" type="module"></script>
  </head>
  <body>
    <main class="page">
      <header class="header">
        <h1>Companies House converter</h1>
        <p class="lede">
          Snapshot products 195 / 216 → CSV. Runs locally in your browser.
        </p>
      </header>

      <section id="capability" class="banner" hidden></section>

      <section class="card">
        <h2>Input</h2>
        <div class="row">
          <button type="button" id="btn-open" class="btn primary">Open file…</button>
          <span id="input-name" class="muted">No file selected</span>
        </div>
        <div id="drop-zone" class="drop-zone" tabindex="0">Drop .dat here</div>
        <input id="file-input" type="file" accept=".dat,text/plain,*/*" hidden />
      </section>

      <section class="card">
        <h2>Output</h2>
        <div class="row">
          <button type="button" id="btn-outdir" class="btn" disabled>Choose folder…</button>
          <span id="outdir-name" class="muted">Not chosen</span>
        </div>
      </section>

      <section class="card">
        <h2>Convert</h2>
        <div class="row">
          <button type="button" id="btn-convert" class="btn primary" disabled>Convert</button>
          <button type="button" id="btn-cancel" class="btn danger" disabled>Cancel</button>
        </div>
        <div class="progress-wrap" aria-live="polite">
          <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
        </div>
        <p id="status" class="status">Ready.</p>
        <dl id="stats" class="stats" hidden>
          <div><dt>Read</dt><dd id="stat-read">—</dd></div>
          <div><dt>Companies</dt><dd id="stat-companies">—</dd></div>
          <div><dt>Persons</dt><dd id="stat-persons">—</dd></div>
          <div><dt>Elapsed</dt><dd id="stat-elapsed">—</dd></div>
          <div><dt>Speed</dt><dd id="stat-speed">—</dd></div>
        </dl>
      </section>

      <p class="footer muted">
        Need more speed? The native
        <a href="https://github.com/mrbrianevans/ch-fixedwidth/releases">CLI</a>
        is about 10× faster than this web converter.
      </p>
    </main>
  </body>
</html>
