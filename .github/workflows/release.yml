name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-windows
            ext: .exe
            name: windows-x86_64
          - os: ubuntu-latest
            target: x86_64-linux-gnu
            ext: ""
            name: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-linux-gnu
            ext: ""
            name: linux-aarch64
          - os: macos-latest
            target: x86_64-macos
            ext: ""
            name: macos-x86_64
          - os: macos-latest
            target: aarch64-macos
            ext: ""
            name: macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build CLI
        shell: bash
        run: |
          zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}
          if [ -f "zig-out/bin/ch-fixedwidth${{ matrix.ext }}" ]; then
            mv "zig-out/bin/ch-fixedwidth${{ matrix.ext }}" "ch-fixedwidth-${{ matrix.name }}${{ matrix.ext }}"
          elif [ -f zig-out/bin/ch-fixedwidth ]; then
            mv zig-out/bin/ch-fixedwidth "ch-fixedwidth-${{ matrix.name }}${{ matrix.ext }}"
          else
            echo "Built binary not found" >&2
            ls -laR zig-out
            exit 1
          fi

      - name: Upload CLI to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ch-fixedwidth-${{ matrix.name }}${{ matrix.ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build freestanding WASM
        run: |
          zig build wasm -Doptimize=ReleaseFast
          if [ -f zig-out/ch_fixedwidth.wasm ]; then
            mv zig-out/ch_fixedwidth.wasm ch_fixedwidth-wasm32-freestanding.wasm
          elif [ -f zig-out/bin/ch_fixedwidth.wasm ]; then
            mv zig-out/bin/ch_fixedwidth.wasm ch_fixedwidth-wasm32-freestanding.wasm
          else
            echo "WASM module not found" >&2
            ls -laR zig-out
            exit 1
          fi

      - name: Upload WASM to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ch_fixedwidth-wasm32-freestanding.wasm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
