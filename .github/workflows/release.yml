name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-windows
            ext: .exe
            name: windows-x86_64
          - os: ubuntu-latest
            target: x86_64-linux-gnu
            ext: ""
            name: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-linux-gnu
            ext: ""
            name: linux-aarch64
          - os: macos-latest
            target: x86_64-macos
            ext: ""
            name: macos-x86_64
          - os: macos-latest
            target: aarch64-macos
            ext: ""
            name: macos-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: zig build-exe parser.zig -OReleaseFast -fstrip --name parser -target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          # Windows emit may be parser.exe; others parser
          if [ -f "parser${{ matrix.ext }}" ]; then
            mv "parser${{ matrix.ext }}" "parser-${{ matrix.name }}${{ matrix.ext }}"
          elif [ -f parser ]; then
            mv parser "parser-${{ matrix.name }}${{ matrix.ext }}"
          else
            echo "Built binary not found" >&2
            ls -la
            exit 1
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: parser-${{ matrix.name }}${{ matrix.ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
