name: CI

on:
  # Any branch push and all PRs (formatting, build, tests).
  push:
  pull_request:

permissions:
  contents: read

jobs:
  zig:
    name: Zig (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Check formatting
        run: zig fmt --check .

      - name: Build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      - name: Build freestanding WASM
        run: zig build wasm -Doptimize=ReleaseSafe

      - name: Run tests
        run: zig build test
